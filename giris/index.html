<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İçerik Robotu – Instagram bağlantısı</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;text-align:center;color:#222}
a.btn,button{display:inline-block;background:#1877f2;color:#fff;padding:16px 26px;border-radius:12px;font-size:18px;text-decoration:none;border:0}
code{display:block;word-break:break-all;background:#f2f2f2;padding:14px;border-radius:10px;margin:18px 0;font-size:14px}</style></head>
<body>
<h1>İçerik Robotu</h1>
<div id="giris">
<p>Instagram hesaplarını robota bağlamak için aşağıdaki butona bas, giriş yap ve <b>iki hesabı da</b> seçip tüm izinleri onayla.</p>
<p><a class="btn" id="link" href="#">Instagram/Facebook ile bağlan</a></p>
</div>
<div id="kod" style="display:none">
<p>✅ Bağlantı tamam! Aşağıdaki kodu kopyala ve Claude'a gönder (10 dakika içinde kullanılmalı):</p>
<code id="c"></code>
<button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Kopyalandı'">Kodu kopyala</button>
</div>
<script>
var APP_ID="28809822041992746", CONFIG_ID="1888720228976579";
var redirect=location.origin+location.pathname;
var q=new URLSearchParams(location.search);
if(q.get("code")){document.getElementById("giris").style.display="none";document.getElementById("kod").style.display="block";document.getElementById("c").textContent=q.get("code");}
document.getElementById("link").href="https://www.facebook.com/v26.0/dialog/oauth?client_id="+APP_ID+"&redirect_uri="+encodeURIComponent(redirect)+"&config_id="+CONFIG_ID+"&response_type=code&override_default_response_type=true";
</script>
</body></html>
